name = "duemeld-backend"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Reminder delivery (ARCHITECTURE §5).
[triggers]
crons = ["*/5 * * * *"]

[vars]
XENITION_API_URL = "https://api.xenition.com/v1"
APP_NAME = "Due Meld"
APP_SCHEME = "duemeld"
APPLE_BUNDLE_ID = "com.infoinlet.duemeld"
GOOGLE_PACKAGE_NAME = "com.infoinlet.duemeld"
READER_MODEL = "google/gemini-2.5-flash"
TRIAL_DAYS = "3"

# Secrets — `wrangler secret put <NAME>`, never committed:
#   XENITION_API_KEY        service key for THIS app
#   (the AI key is the app's own OpenRouter key stored IN Xenition — scripts/ai-key.ts — not a worker secret)
#   EXPO_ACCESS_TOKEN       Expo enhanced push security
#   JOB_SECRET              to run the delivery job by hand
#   APPLE_KEY_ID, APPLE_ISSUER_ID, APPLE_PRIVATE_KEY · GOOGLE_CLIENT_EMAIL, GOOGLE_PRIVATE_KEY
#   META_APP_ID, META_CAPI_ACCESS_TOKEN   (ads measurement; dormant while empty)
